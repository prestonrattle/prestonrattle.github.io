on:
  push:
    branches: main

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter and pandas
        run: pip install jupyter pandas

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX
        run: quarto install tinytex

      - name: Render site
        run: quarto render

      - name: Render resume as PDF
        run: quarto render resume.qmd --to pdf -o resume.pdf

      - name: Ensure resume PDF is in docs folder
        run: |
          if [ -f resume.pdf ]; then
            mv resume.pdf docs/resume.pdf
          elif [ -f docs/resume.pdf ]; then
            echo "PDF already in docs/, nothing to move."
          else
            echo "Could not find rendered resume.pdf anywhere!"
            find . -name "resume.pdf"
            exit 1
          fi

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
