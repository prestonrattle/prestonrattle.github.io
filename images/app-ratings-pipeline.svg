<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-label="Every night, one script reads two stores and writes two rows" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title>Every night, one script reads two stores and writes two rows</title>
  <defs>
    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="352" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1a1a1a">Every night, one script reads two stores and writes two rows</text>

  <g fill="none" stroke="#9ca3af" stroke-width="1.25">
    <path d="M200 148H246" marker-end="url(#pipe-arrow)"/>
    <path d="M448 128H484V100H518" marker-end="url(#pipe-arrow)"/>
    <path d="M448 168H484V196H518" marker-end="url(#pipe-arrow)"/>
    <path d="M348 184V254" marker-end="url(#pipe-arrow)"/>
  </g>

  <g text-anchor="middle">
    <rect x="24" y="112" width="176" height="72" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
    <text x="112" y="136" font-weight="600" fill="#1a1a1a">GitHub Actions</text>
    <text x="112" y="152" font-size="11.5" fill="#6b7280">Runs at 00:00 UTC daily</text>
    <text x="112" y="168" font-size="11.5" fill="#6b7280">Passes in the secret key</text>

    <rect x="248" y="112" width="200" height="72" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
    <text x="348" y="136" font-weight="600" fill="#1a1a1a">Python script</text>
    <text x="348" y="152" font-size="11.5" fill="#6b7280">Fetches both stores</text>
    <text x="348" y="168" font-size="11.5" fill="#6b7280">Retries and safety checks</text>

    <rect x="520" y="64" width="216" height="72" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
    <text x="628" y="88" font-weight="600" fill="#1a1a1a">App Store</text>
    <text x="628" y="104" font-size="11.5" fill="#6b7280">itunes.apple.com/lookup</text>
    <text x="628" y="120" font-size="11.5" fill="#6b7280">JSON: rating and count</text>

    <rect x="520" y="160" width="216" height="72" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
    <text x="628" y="184" font-weight="600" fill="#1a1a1a">Google Play</text>
    <text x="628" y="200" font-size="11.5" fill="#6b7280">US store page (gl=US)</text>
    <text x="628" y="216" font-size="11.5" fill="#6b7280">JSON-LD: rating and count</text>

    <rect x="248" y="256" width="200" height="72" rx="8" fill="#4f46e5" fill-opacity="0.08" stroke="#4f46e5" stroke-width="2"/>
    <text x="348" y="280" font-weight="600" fill="#1a1a1a">Google Sheet</text>
    <text x="348" y="296" font-size="11.5" fill="#1a1a1a">Sheets API, service account</text>
    <text x="348" y="312" font-size="11.5" fill="#1a1a1a">2 new rows per day</text>

    <text x="224" y="140" font-size="11.5" fill="#6b7280">starts</text>
    <text x="484" y="152" font-size="11.5" fill="#6b7280">fetch</text>
  </g>
  <text x="356" y="224" font-size="11.5" fill="#6b7280">append rows</text>
</svg>
