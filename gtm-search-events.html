<script>
  window.dataLayer = window.dataLayer || [];

  document.addEventListener('click', function (e) {

    // search_start: user clicks the search icon/button that opens the search bar
    var searchButton = e.target.closest('#quarto-search .aa-DetachedSearchButton');
    if (searchButton) {
      dataLayer.push({ 'event': 'search_start' });
    }

    // search_complete: user clicks a result inside the search results list
    var resultLink = e.target.closest('.aa-Item a');
    if (resultLink) {
      var item = resultLink.closest('.aa-Item');
      var list = item ? item.closest('.aa-List') : null;
      var position = null;
      var resultCount = null;

      if (list) {
        var items = Array.prototype.slice.call(list.querySelectorAll('.aa-Item'));
        position = items.indexOf(item) + 1; // 1-based position
        resultCount = items.length;
      }

      // Page title: a doc-level result carries its own .search-result-title;
      // a grouped sub-section result (.search-result-doc-section) has none and
      // relies on the nearest preceding sibling item for the page it belongs to.
      var pageTitleEl = item ? item.querySelector('.search-result-title') : null;
      var pageTitleItem = item;
      while (!pageTitleEl && pageTitleItem && pageTitleItem.previousElementSibling) {
        pageTitleItem = pageTitleItem.previousElementSibling;
        pageTitleEl = pageTitleItem.querySelector('.search-result-title');
      }
      var resultPage = pageTitleEl ? pageTitleEl.textContent.trim().toLowerCase() : null;

      // Result title: prefer the matched section/heading name when present
      // (e.g. "Education"), falling back to the page title for page-level
      // matches with no specific heading.
      var sectionEl = item ? item.querySelector('.search-result-section') : null;
      var resultTitle = sectionEl
        ? sectionEl.textContent.trim().toLowerCase()
        : (resultPage || resultLink.textContent.trim().toLowerCase());

      var searchInput = document.querySelector('#quarto-search input, .aa-Input');
      var searchTerm = searchInput ? searchInput.value.toLowerCase() : '';

      dataLayer.push({
        'event': 'search_complete',
        'search_term': searchTerm,
        'result_position': position,
        'result_title': resultTitle,
        'result_page': resultPage,
        'result_count': resultCount
      });
    }

  });
</script>
